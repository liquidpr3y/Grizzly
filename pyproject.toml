[project]
name = "grizzly"
version = "0.1.0"
description = "Local, Apple Silicon accelerated story studio: LLM-assisted writing to comics, visual novels and animatics."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pillow>=10.1",
]

[project.optional-dependencies]
# Apple Silicon inference backends. Install on the Mac only.
mac = [
    "mlx-lm>=0.32",
    "mflux>=0.23",
]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "fastapi>=0.110",
]

[project.scripts]
grizzly = "grizzly.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grizzly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
