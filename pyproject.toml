[project]
name = "grizzly"
version = "0.1.0"
description = "Local, Apple Silicon accelerated story studio: LLM-assisted writing to comics, visual novels and animatics."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pydantic>=2.6",
    # 13.0 breaks on Python <3.15 (eager import in PIL._typing); mflux needs >=12.3.
    "pillow>=12.3,<13",
]

[project.optional-dependencies]
# Apple Silicon inference backends. Install on the Mac only.
mac = [
    "mlx-lm>=0.32",
    "mflux>=0.23",
]
# Image-to-video (Wan 2.2 TI2V-5B via mlx-video, MIT). Pinned: mlx-video has
# no tagged release that includes Wan 2.2.
video = [
    "mlx-video @ git+https://github.com/Blaizzy/mlx-video@87db56a51758fefb748a359b90a5283bb8ba4837",
]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "fastapi>=0.110",
]

[project.scripts]
grizzly = "grizzly.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grizzly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
